services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nihongo_webapp}
      MYSQL_USER: ${MYSQL_USER:-nihongo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nihongo_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./database/seed/001_jlpt_levels.sql:/docker-entrypoint-initdb.d/002_jlpt_levels.sql:ro

  backend:
    build:
      context: ./backend
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env.example
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  frontend_node_modules:
